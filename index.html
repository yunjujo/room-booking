<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특별실 예약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f6f7f4;
    --card: #ffffff;
    --ink: #1f2a24;
    --muted: #66706a;
    --line: #e3e6e0;
    --accent: #2f7d5b;
    --accent-soft: #e5f2eb;
    --accent-ink: #1e5a40;
    --warn: #b4472f;
    --warn-soft: #fbeae5;
    --today: #fff7dc;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 20px 16px;
  }
  header .inner, main { max-width: 1080px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; opacity: .85; font-size: .95rem; }
  main { padding: 16px; display: grid; gap: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }
  .card h2 { margin: 0 0 14px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .card h2 .num {
    display: inline-grid; place-items: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-ink); font-size: .85rem;
  }

  .grid-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .grid-form .wide { grid-column: span 2; }
  .grid-form .full { grid-column: 1 / -1; }
  label { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  label .req { color: var(--warn); }
  input, select {
    width: 100%; padding: 10px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); padding: 10px 14px;
  }
  button:hover { background: #f1f3ef; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button.primary:hover { background: var(--accent-ink); }
  button:disabled { opacity: .55; cursor: wait; }
  button.danger { color: var(--warn); border-color: #f0c9bf; padding: 6px 12px; font-size: .9rem; }
  button.danger:hover { background: var(--warn-soft); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* 주간 시간표 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar select { width: auto; min-width: 140px; }
  .toolbar .week-label { font-weight: 700; margin: 0 6px; }
  .toolbar .spacer { flex: 1; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.tt { width: 100%; min-width: 560px; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
  table.tt th { font-size: .9rem; color: var(--muted); font-weight: 600; padding: 6px 4px; }
  table.tt th.today { color: var(--accent-ink); }
  table.tt th .date { display: block; font-size: .78rem; font-weight: 400; }
  table.tt td.period { width: 56px; text-align: center; font-weight: 700; color: var(--muted); }
  table.tt td.slot {
    height: 64px; border-radius: 10px; text-align: center; vertical-align: middle;
    font-size: .9rem; padding: 4px; cursor: pointer;
    border: 1.5px dashed var(--line); color: #a3aaa5;
  }
  table.tt td.slot:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  table.tt td.slot.today { background: var(--today); }
  table.tt td.slot.booked {
    border: 1.5px solid transparent; background: var(--accent-soft); color: var(--accent-ink); cursor: default;
  }
  table.tt td.slot.booked strong { display: block; font-size: .95rem; }
  table.tt td.slot.booked span { font-size: .8rem; color: var(--muted); }
  table.tt td.slot.past:not(.booked) { cursor: default; background: #f3f4f1; border-style: solid; color: transparent; }
  table.tt td.slot.past:not(.booked):hover { border-color: var(--line); }
  .hint { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }

  /* 검색·목록 */
  .search { display: grid; grid-template-columns: 2fr 1.5fr 1.5fr auto; gap: 10px; align-items: end; margin-bottom: 12px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); margin-bottom: 12px; }
  .check input { width: auto; }
  .list { display: grid; gap: 8px; }
  .item {
    display: grid; grid-template-columns: 150px 90px 1fr auto; gap: 12px; align-items: center;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
  }
  .item .when { font-weight: 700; }
  .item .room { color: var(--accent-ink); font-weight: 600; }
  .item .who small { color: var(--muted); display: block; }
  .item.past { opacity: .6; }
  .empty { color: var(--muted); text-align: center; padding: 20px; }

  /* 알림 */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px;
    font-weight: 600; max-width: calc(100% - 32px); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--warn); }
  #toast.ok { background: var(--accent); }
  .setup {
    background: var(--warn-soft); border: 1px solid #f0c9bf; color: var(--warn);
    border-radius: var(--radius); padding: 16px; font-weight: 600;
  }

  @media (max-width: 760px) {
    .grid-form { grid-template-columns: 1fr 1fr; }
    .grid-form .wide { grid-column: 1 / -1; }
    .search { grid-template-columns: 1fr 1fr; }
    .search .grow { grid-column: 1 / -1; }
    .item { grid-template-columns: 1fr auto; }
    .item .when { grid-column: 1 / 2; }
    .item .room { grid-column: 1 / 2; }
    .item .who { grid-column: 1 / 2; }
    .item button { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
    .toolbar select { flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>🏫 특별실 예약</h1>
    <p>과학실·음악실·컴퓨터실 등 특별실을 교시 단위로 예약합니다.</p>
  </div>
</header>

<main>
  <div id="setup" class="setup" hidden>
    index.html 맨 아래 &lt;script&gt;의 SUPABASE_URL, SUPABASE_KEY 값을 내 프로젝트 값으로 바꿔 주세요.
    (Supabase › Project Settings › API Keys 에서 Project URL과 publishable key를 복사)
  </div>

  <!-- 1. 예약 등록 -->
  <section class="card" id="form-card">
    <h2><span class="num">1</span>예약 등록</h2>
    <form id="form" class="grid-form" autocomplete="off">
      <div class="wide">
        <label for="f-room">특별실 <span class="req">*</span></label>
        <select id="f-room" required></select>
      </div>
      <div>
        <label for="f-date">날짜 <span class="req">*</span></label>
        <input type="date" id="f-date" required>
      </div>
      <div>
        <label for="f-period">교시 <span class="req">*</span></label>
        <select id="f-period" required>
          <option value="1">1교시</option><option value="2">2교시</option><option value="3">3교시</option>
          <option value="4">4교시</option><option value="5">5교시</option><option value="6">6교시</option>
        </select>
      </div>
      <div class="wide">
        <label for="f-teacher">교사 이름 <span class="req">*</span></label>
        <input type="text" id="f-teacher" maxlength="20" placeholder="예: 김민지" required>
      </div>
      <div>
        <label for="f-grade">학년 <span class="req">*</span></label>
        <select id="f-grade" required>
          <option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option>
          <option value="4">4학년</option><option value="5">5학년</option><option value="6">6학년</option>
        </select>
      </div>
      <div>
        <label for="f-class">반</label>
        <input type="number" id="f-class" min="1" max="15" placeholder="예: 2">
      </div>
      <div class="full">
        <label for="f-purpose">사용 목적</label>
        <input type="text" id="f-purpose" maxlength="100" placeholder="예: 식물 관찰 실험">
      </div>
      <div class="full actions">
        <button type="submit" class="primary" id="f-submit">예약하기</button>
      </div>
    </form>
  </section>

  <!-- 2. 주간 시간표 -->
  <section class="card">
    <h2><span class="num">2</span>주간 시간표</h2>
    <div class="toolbar">
      <select id="w-room" aria-label="시간표 특별실"></select>
      <span class="spacer"></span>
      <button type="button" id="w-prev">◀ 이전 주</button>
      <span class="week-label" id="w-label"></span>
      <button type="button" id="w-next">다음 주 ▶</button>
      <button type="button" id="w-today">이번 주</button>
    </div>
    <div class="table-wrap">
      <table class="tt">
        <thead id="w-head"></thead>
        <tbody id="w-body"></tbody>
      </table>
    </div>
    <p class="hint">빈칸을 누르면 그 시간으로 예약 등록 칸이 채워집니다.</p>
  </section>

  <!-- 3. 검색 · 4. 취소 -->
  <section class="card">
    <h2><span class="num">3</span>예약 검색 · 취소</h2>
    <div class="search">
      <div class="grow">
        <label for="s-teacher">교사 이름</label>
        <input type="text" id="s-teacher" placeholder="이름 일부만 입력해도 됩니다">
      </div>
      <div>
        <label for="s-room">특별실</label>
        <select id="s-room"></select>
      </div>
      <div>
        <label for="s-date">날짜</label>
        <input type="date" id="s-date">
      </div>
      <div>
        <button type="button" id="s-reset">초기화</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="s-past"> 지난 예약도 보기</label>
    <div class="list" id="list"></div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// ① 여기에 내 Supabase 값을 붙여 넣으세요 (publishable key만! secret key는 절대 금지)
// =====================================================================
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YOUR-KEY';

// =====================================================================
// 기본 설정
// =====================================================================
const PERIODS = [1, 2, 3, 4, 5, 6];
const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
let db = null;              // Supabase 클라이언트 (콘솔에서도 db.from(...) 으로 사용 가능)
let rooms = [];             // 특별실 목록
let weekStart = mondayOf(new Date());   // 시간표에 보이는 주의 월요일

const $ = (id) => document.getElementById(id);

// ---------- 날짜 도우미 (한국 시간 기준, toISOString 사용 안 함) ----------
function pad(n) { return String(n).padStart(2, '0'); }
function fmt(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function todayStr() { return fmt(new Date()); }
function niceDate(s) { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DAY_NAMES[d.getDay()]})`; }

// ---------- 화면 도우미 ----------
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
let toastTimer;
function toast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ''), 3200);
}
function errMsg(e) {
  if (e.code === '23505') return '이미 예약된 시간입니다. 다른 교시나 날짜를 골라 주세요.';
  if (e.code === '23514') return '입력값이 허용 범위를 벗어났습니다. (교시·학년·반·글자 수 확인)';
  if (e.code === '23503') return '존재하지 않는 특별실입니다. 새로고침 후 다시 시도해 주세요.';
  if (e.code === '42501') return '권한이 없습니다. Supabase의 RLS 정책을 확인해 주세요.';
  return '오류가 발생했습니다: ' + (e.message || e);
}
function roomName(id) { return rooms.find((r) => r.id === Number(id))?.name ?? '?'; }
function classLabel(r) { return r.class_no ? `${r.grade}학년 ${r.class_no}반` : `${r.grade}학년`; }

// =====================================================================
// 특별실 불러오기
// =====================================================================
async function loadRooms() {
  const { data, error } = await db.from('rooms').select('id, name, location').order('id');
  if (error) { toast(errMsg(error), 'error'); return; }
  rooms = data;
  const opts = rooms.map((r) => `<option value="${r.id}">${esc(r.name)}${r.location ? ' · ' + esc(r.location) : ''}</option>`).join('');
  $('f-room').innerHTML = opts;
  $('w-room').innerHTML = opts;
  $('s-room').innerHTML = '<option value="">전체</option>' + opts;
}

// =====================================================================
// 1. 예약 등록
// =====================================================================
async function submitReservation(ev) {
  ev.preventDefault();
  const date = $('f-date').value;
  const teacher = $('f-teacher').value.trim();
  const classNo = $('f-class').value;
  const purpose = $('f-purpose').value.trim();

  if (!date) return toast('날짜를 선택해 주세요.', 'error');
  const dow = parse(date).getDay();
  if (dow === 0 || dow === 6) return toast('주말에는 예약할 수 없습니다.', 'error');
  if (date < todayStr()) return toast('지난 날짜는 예약할 수 없습니다.', 'error');
  if (!teacher) return toast('교사 이름을 입력해 주세요.', 'error');
  if (classNo && (classNo < 1 || classNo > 15)) return toast('반은 1~15 사이로 입력해 주세요.', 'error');

  const row = {
    room_id: Number($('f-room').value),
    reserved_date: date,
    period: Number($('f-period').value),
    teacher_name: teacher,
    grade: Number($('f-grade').value),
    class_no: classNo ? Number(classNo) : null,
    purpose: purpose || null,
  };

  const btn = $('f-submit');
  btn.disabled = true; btn.textContent = '저장 중…';
  const { error } = await db.from('reservations').insert(row);
  btn.disabled = false; btn.textContent = '예약하기';

  // 보고 있는 시간표를 방금 예약한 특별실·주로 맞춤
  $('w-room').value = row.room_id;
  weekStart = mondayOf(parse(date));

  if (error) {
    toast(errMsg(error), 'error');
  } else {
    toast(`${niceDate(date)} ${row.period}교시 ${roomName(row.room_id)} 예약 완료!`, 'ok');
    $('f-purpose').value = '';
  }
  await Promise.all([renderWeek(), loadList()]);   // 성공·실패 모두 최신 상태로 새로 고침
}

// =====================================================================
// 2. 주간 시간표
// =====================================================================
async function renderWeek() {
  const roomId = Number($('w-room').value);
  const days = [0, 1, 2, 3, 4].map((i) => addDays(weekStart, i));
  const friday = days[4];
  const today = todayStr();

  $('w-label').textContent =
    `${weekStart.getMonth() + 1}월 ${weekStart.getDate()}일 ~ ${friday.getMonth() + 1}월 ${friday.getDate()}일`;

  $('w-head').innerHTML = '<tr><th></th>' + days.map((d) => {
    const isToday = fmt(d) === today;
    return `<th class="${isToday ? 'today' : ''}">${DAY_NAMES[d.getDay()]}<span class="date">${d.getMonth() + 1}/${d.getDate()}${isToday ? ' 오늘' : ''}</span></th>`;
  }).join('') + '</tr>';

  if (!roomId) { $('w-body').innerHTML = ''; return; }

  const { data, error } = await db.from('reservations')
    .select('id, reserved_date, period, teacher_name, grade, class_no, purpose')
    .eq('room_id', roomId)
    .gte('reserved_date', fmt(weekStart))
    .lte('reserved_date', fmt(friday));
  if (error) { toast(errMsg(error), 'error'); return; }

  const map = {};
  data.forEach((r) => (map[`${r.reserved_date}_${r.period}`] = r));

  $('w-body').innerHTML = PERIODS.map((p) => {
    const cells = days.map((d) => {
      const ds = fmt(d);
      const r = map[`${ds}_${p}`];
      const cls = ['slot'];
      if (ds === today) cls.push('today');
      if (ds < today) cls.push('past');
      if (r) {
        cls.push('booked');
        const tip = r.purpose ? ` title="${esc(r.purpose)}"` : '';
        return `<td class="${cls.join(' ')}"${tip}><strong>${esc(r.teacher_name)}</strong><span>${esc(classLabel(r))}</span></td>`;
      }
      return `<td class="${cls.join(' ')}" data-date="${ds}" data-period="${p}">${ds < today ? '' : '+ 예약'}</td>`;
    }).join('');
    return `<tr><td class="period">${p}교시</td>${cells}</tr>`;
  }).join('');
}

// 빈칸 클릭 → 예약 등록 칸 채우기
function onSlotClick(ev) {
  const td = ev.target.closest('td.slot');
  if (!td || td.classList.contains('booked') || td.classList.contains('past')) return;
  $('f-room').value = $('w-room').value;
  $('f-date').value = td.dataset.date;
  $('f-period').value = td.dataset.period;
  $('form-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => $('f-teacher').focus(), 400);
}

// =====================================================================
// 3. 검색
// =====================================================================
async function loadList() {
  const teacher = $('s-teacher').value.trim();
  const roomId = $('s-room').value;
  const date = $('s-date').value;
  const showPast = $('s-past').checked;

  let q = db.from('reservations')
    .select('id, room_id, reserved_date, period, teacher_name, grade, class_no, purpose')
    .order('reserved_date', { ascending: true })
    .order('period', { ascending: true })
    .limit(200);

  if (teacher) q = q.ilike('teacher_name', `%${teacher}%`);
  if (roomId) q = q.eq('room_id', Number(roomId));
  if (date) q = q.eq('reserved_date', date);
  else if (!showPast) q = q.gte('reserved_date', todayStr());

  const { data, error } = await q;
  if (error) { toast(errMsg(error), 'error'); return; }

  if (!data.length) {
    $('list').innerHTML = '<div class="empty">조건에 맞는 예약이 없습니다.</div>';
    return;
  }
  const today = todayStr();
  $('list').innerHTML = data.map((r) => `
    <div class="item ${r.reserved_date < today ? 'past' : ''}">
      <div class="when">${niceDate(r.reserved_date)}</div>
      <div class="room">${r.period}교시 · ${esc(roomName(r.room_id))}</div>
      <div class="who">${esc(r.teacher_name)} 선생님 · ${esc(classLabel(r))}${r.purpose ? `<small>${esc(r.purpose)}</small>` : ''}</div>
      <button type="button" class="danger" data-id="${r.id}"
        data-label="${esc(`${niceDate(r.reserved_date)} ${r.period}교시 ${roomName(r.room_id)} (${r.teacher_name})`)}">취소</button>
    </div>`).join('');
}

// =====================================================================
// 4. 취소
// =====================================================================
async function onCancelClick(ev) {
  const btn = ev.target.closest('button[data-id]');
  if (!btn) return;
  if (!confirm(`${btn.dataset.label} 예약을 취소할까요?\n취소하면 되돌릴 수 없습니다.`)) return;

  btn.disabled = true;
  const { data, error } = await db.from('reservations').delete().eq('id', Number(btn.dataset.id)).select('id');
  if (error) {
    toast(errMsg(error), 'error');
  } else if (!data.length) {
    toast('이미 취소되었거나 삭제 권한이 없습니다.', 'error');
  } else {
    toast('예약을 취소했습니다.', 'ok');
  }
  await Promise.all([renderWeek(), loadList()]);
}

// =====================================================================
// 시작
// =====================================================================
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function init() {
  if (SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_KEY.includes('YOUR-KEY')) {
    $('setup').hidden = false;
    return;
  }
  db = window.supabase.createClient(https://mhmgfxzghsntbpntwafh.supabase.co, sb_publishable_qjnZWIXahEkII-MiE66nsw_-SZz75oj);

  // 기본 날짜: 오늘(주말이면 다음 월요일)
  let d = new Date();
  if (d.getDay() === 6) d = addDays(d, 2);
  if (d.getDay() === 0) d = addDays(d, 1);
  $('f-date').value = fmt(d);
  $('f-date').min = todayStr();
  weekStart = mondayOf(d);

  await loadRooms();
  await Promise.all([renderWeek(), loadList()]);

  $('form').addEventListener('submit', submitReservation);
  $('w-room').addEventListener('change', renderWeek);
  $('w-prev').addEventListener('click', () => { weekStart = addDays(weekStart, -7); renderWeek(); });
  $('w-next').addEventListener('click', () => { weekStart = addDays(weekStart, 7); renderWeek(); });
  $('w-today').addEventListener('click', () => { weekStart = mondayOf(new Date()); renderWeek(); });
  $('w-body').addEventListener('click', onSlotClick);
  $('s-teacher').addEventListener('input', debounce(loadList, 300));
  $('s-room').addEventListener('change', loadList);
  $('s-date').addEventListener('change', loadList);
  $('s-past').addEventListener('change', loadList);
  $('s-reset').addEventListener('click', () => {
    $('s-teacher').value = ''; $('s-room').value = ''; $('s-date').value = ''; $('s-past').checked = false;
    loadList();
  });
  $('list').addEventListener('click', onCancelClick);
}

init();
</script>
